databases:
  - name: pos-db
    databaseName: pos_db
    user: pos_user
    plan: free

services:
  - type: web
    name: pos-system
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn pos_system.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
    plan: free